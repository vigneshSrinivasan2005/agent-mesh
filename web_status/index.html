<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent-Mesh // Multi-Device Network Health</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .brand span { font-size: 0.85rem; color: var(--accent); background: rgba(56, 189, 248, 0.1); padding: 0.2rem 0.5rem; border-radius: 4px; }
    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .status-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-healthy { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid var(--green); }
    .status-degraded { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
    .status-critical { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
    
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-val { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .node-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-border);
    }
    .node-card.online::before { background: var(--green); }
    .node-card.degraded::before { background: var(--yellow); }
    .node-card.offline::before { background: var(--red); }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .node-title { font-size: 1.15rem; font-weight: 600; color: #fff; }
    .node-url { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
    .priority-badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      background: #1e293b;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .node-latency {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin: 1rem 0;
      padding: 0.75rem;
      background: #0f172a;
      border-radius: 6px;
    }
    .latency-num { font-size: 1.5rem; font-weight: 700; font-family: monospace; }
    .latency-p { font-size: 0.8rem; color: var(--text-muted); }

    .roles-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .role-tag {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
      background: rgba(168, 85, 247, 0.15);
      color: var(--purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .role-tag.autocomplete {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .vram-section {
      background: #0f172a;
      border-radius: 6px;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    .vram-header { display: flex; justify-content: space-between; color: var(--text-muted); margin-bottom: 0.35rem; }
    .warm-badge { font-weight: 600; }
    .warm-badge.warm { color: var(--green); }
    .warm-badge.cold { color: var(--text-muted); }
    .model-name { font-family: monospace; color: #fff; font-weight: 600; }

    .type-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .type-badge.docker {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .type-badge.scaled {
      background: rgba(234, 179, 8, 0.15);
      color: var(--yellow);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }
    .type-badge.native {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .metrics-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Agent-Mesh Gateway</h1>
        <span>v0.1.0</span>
      </div>
      <div class="header-actions">
        <span id="mesh-badge" class="status-badge status-healthy">Checking...</span>
        <button class="btn" onclick="fetchStatus()">Refresh Now</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Online Devices</div>
        <div id="stat-online" class="stat-val">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active In-Flight</div>
        <div id="stat-active" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Requests</div>
        <div id="stat-total" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nodes Degraded / Down</div>
        <div id="stat-down" class="stat-val">--</div>
      </div>
    </div>

    <div id="nodes-container" class="grid">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Failed to fetch health status:', err);
        document.getElementById('mesh-badge').className = 'status-badge status-critical';
        document.getElementById('mesh-badge').innerText = 'Gateway Offline';
      }
    }

    function renderDashboard(data) {
      // Update top badge
      const badge = document.getElementById('mesh-badge');
      badge.innerText = data.status.toUpperCase();
      badge.className = `status-badge status-${data.status}`;

      // Update counters
      document.getElementById('stat-online').innerText = `${data.online_nodes} / ${data.total_nodes}`;
      document.getElementById('stat-active').innerText = data.active_requests;
      document.getElementById('stat-total').innerText = data.total_requests;
      document.getElementById('stat-down').innerText = `${data.degraded_nodes + data.offline_nodes}`;

      // Render cards
      const container = document.getElementById('nodes-container');
      container.innerHTML = '';

      data.nodes.forEach(node => {
        const card = document.createElement('div');
        const stateClass = node.state.toLowerCase();
        card.className = `node-card ${stateClass}`;

        const isAutocomplete = node.roles.includes('autocomplete');
        const rolesHtml = node.roles.map(r => 
          `<span class="role-tag ${r === 'autocomplete' ? 'autocomplete' : ''}">${r}</span>`
        ).join('');

        const isContainer = node.is_container;
        const isAutoScaled = node.is_auto_scaled;
        let typeBadgeHtml = '<span class="type-badge native">Native</span>';
        if (isAutoScaled) {
          typeBadgeHtml = '<span class="type-badge scaled">Auto-Scaled</span>';
        } else if (isContainer) {
          typeBadgeHtml = `<span class="type-badge docker">Docker${node.container_id ? ` (${node.container_id})` : ''}</span>`;
        }

        const latencyColor = node.state === 'OFFLINE' ? 'var(--red)' : (node.latency_ms > 200 ? 'var(--yellow)' : 'var(--green)');
        const latencyText = node.state === 'OFFLINE' ? 'OFFLINE' : `${node.latency_ms} ms`;

        card.innerHTML = `
          <div class="node-header">
            <div>
              <div class="node-title">${node.name} ${typeBadgeHtml}</div>
              <div class="node-url">${node.base_url}</div>
            </div>
            <span class="priority-badge">Priority ${node.priority}</span>
          </div>

          <div class="roles-list">${rolesHtml}</div>

          <div class="node-latency">
            <div class="latency-num" style="color: ${latencyColor}">${latencyText}</div>
            <div class="latency-p">${node.state !== 'OFFLINE' ? `P50: ${node.p50_latency_ms}ms / P95: ${node.p95_latency_ms}ms` : (node.error_message || 'Unreachable')}</div>
          </div>

          <div class="vram-section">
            <div class="vram-header">
              <span>Pinned VRAM Model</span>
              <span class="warm-badge ${node.pinned_model_warm ? 'warm' : 'cold'}">
                ${node.pinned_model_warm ? '● WARM (VRAM)' : '○ NOT LOADED'}
              </span>
            </div>
            <div class="model-name">${node.pinned_model || 'None specified'}</div>
          </div>

          <div class="metrics-row">
            <span>In-flight: <strong>${node.active_requests}</strong></span>
            <span>Total: <strong>${node.total_requests}</strong></span>
            <span>Errors: <strong style="color: ${node.failed_requests > 0 ? 'var(--red)' : 'inherit'}">${node.failed_requests}</strong></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Auto-refresh every 3 seconds
    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
