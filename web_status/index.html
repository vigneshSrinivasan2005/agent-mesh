<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent-Mesh // Fleet Telemetry & Health Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
      --purple: #a855f7;
      --cyan: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem;
    }
    .container { max-width: 1240px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .brand span { font-size: 0.85rem; color: var(--accent); background: rgba(56, 189, 248, 0.1); padding: 0.2rem 0.5rem; border-radius: 4px; }
    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .status-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-healthy { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid var(--green); }
    .status-degraded { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
    .status-critical { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
    
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-val { font-size: 1.6rem; font-weight: 700; margin-top: 0.25rem; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .node-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-border);
    }
    .node-card.online::before { background: var(--green); }
    .node-card.degraded::before { background: var(--yellow); }
    .node-card.offline::before { background: var(--red); }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .node-title { font-size: 1.15rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .node-url { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
    .priority-badge {
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      background: #1e293b;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .node-latency {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #0f172a;
      border-radius: 6px;
    }
    .latency-num { font-size: 1.4rem; font-weight: 700; font-family: monospace; }
    .latency-p { font-size: 0.8rem; color: var(--text-muted); }

    .roles-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .role-tag {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
      background: rgba(168, 85, 247, 0.15);
      color: var(--purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .role-tag.autocomplete {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .role-tag.reasoning {
      background: rgba(234, 179, 8, 0.15);
      color: var(--yellow);
      border-color: rgba(234, 179, 8, 0.3);
    }

    /* VRAM & Offload Section */
    .vram-section {
      background: #0f172a;
      border-radius: 8px;
      padding: 0.9rem;
      font-size: 0.85rem;
      border: 1px solid #1e293b;
    }
    .vram-header { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); margin-bottom: 0.45rem; }
    .model-name { font-family: monospace; color: #fff; font-weight: 700; font-size: 0.95rem; }
    
    .model-tags {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }
    .model-meta-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      background: #1e293b;
      color: var(--cyan);
      font-family: monospace;
    }

    /* Split progress bar */
    .offload-bar-wrapper {
      margin-top: 0.65rem;
    }
    .offload-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 0.3rem;
    }
    .offload-bar-track {
      height: 8px;
      border-radius: 4px;
      background: #1e293b;
      display: flex;
      overflow: hidden;
    }
    .bar-gpu {
      background: var(--green);
      height: 100%;
      transition: width 0.3s ease;
    }
    .bar-cpu {
      background: var(--orange);
      height: 100%;
      transition: width 0.3s ease;
    }

    .swap-alert {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-top: 0.5rem;
    }
    .swap-alert.active {
      background: rgba(249, 115, 22, 0.15);
      color: var(--orange);
      border: 1px solid rgba(249, 115, 22, 0.3);
    }
    .swap-alert.pure-gpu {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .swap-alert.idle {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }

    /* Performance / Rate Widget */
    .perf-widget {
      background: #0f172a;
      border-radius: 8px;
      padding: 0.75rem;
      border: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .perf-rate {
      font-size: 1.2rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--accent);
    }
    .perf-details {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* Installed Models Inventory */
    .inventory-section {
      font-size: 0.8rem;
    }
    .inventory-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }
    .inventory-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .inventory-badge {
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
    }
    .inventory-badge.active-model {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .type-badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .type-badge.docker {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .type-badge.scaled {
      background: rgba(234, 179, 8, 0.15);
      color: var(--yellow);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }
    .type-badge.native {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .metrics-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 0.75rem;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Agent-Mesh Gateway</h1>
        <span>Fleet Health & Diagnostics</span>
      </div>
      <div class="header-actions">
        <span id="mesh-badge" class="status-badge status-healthy">Checking...</span>
        <button class="btn" onclick="fetchStatus()">Refresh Now</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Online Devices</div>
        <div id="stat-online" class="stat-val">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active In-Flight</div>
        <div id="stat-active" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Requests</div>
        <div id="stat-total" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Tokens Streamed</div>
        <div id="stat-tokens" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nodes Degraded / Down</div>
        <div id="stat-down" class="stat-val">--</div>
      </div>
    </div>

    <div id="nodes-container" class="grid">
      <!-- Injected dynamically -->
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Failed to fetch health status:', err);
        document.getElementById('mesh-badge').className = 'status-badge status-critical';
        document.getElementById('mesh-badge').innerText = 'Gateway Offline';
      }
    }

    function renderDashboard(data) {
      // Update top badge
      const badge = document.getElementById('mesh-badge');
      badge.innerText = data.status.toUpperCase();
      badge.className = `status-badge status-${data.status}`;

      // Aggregate total tokens generated across all nodes
      const totalTokens = (data.nodes || []).reduce((acc, n) => acc + (n.total_tokens_generated || n.tokens_generated || 0), 0);

      // Update counters
      document.getElementById('stat-online').innerText = `${data.online_nodes} / ${data.total_nodes}`;
      document.getElementById('stat-active').innerText = data.active_requests;
      document.getElementById('stat-total').innerText = data.total_requests;
      document.getElementById('stat-tokens').innerText = totalTokens.toLocaleString();
      document.getElementById('stat-down').innerText = `${data.degraded_nodes + data.offline_nodes}`;

      // Render cards
      const container = document.getElementById('nodes-container');
      container.innerHTML = '';

      (data.nodes || []).forEach(node => {
        const card = document.createElement('div');
        const stateClass = (node.state || 'offline').toLowerCase();
        card.className = `node-card ${stateClass}`;

        const rolesHtml = (node.roles || []).map(r => 
          `<span class="role-tag ${r}">${r}</span>`
        ).join('');

        let typeBadgeHtml = '<span class="type-badge native">Native</span>';
        if (node.is_auto_scaled) {
          typeBadgeHtml = '<span class="type-badge scaled">Auto-Scaled</span>';
        } else if (node.is_container) {
          typeBadgeHtml = `<span class="type-badge docker">Docker${node.container_id ? ` (${node.container_id})` : ''}</span>`;
        }

        const latencyColor = node.state === 'OFFLINE' ? 'var(--red)' : (node.latency_ms > 200 ? 'var(--yellow)' : 'var(--green)');
        const latencyText = node.state === 'OFFLINE' ? 'OFFLINE' : `${node.latency_ms} ms`;

        // Active Model & VRAM / RAM Split
        const isWarm = !!(node.active_model_name || (node.loaded_models && node.loaded_models.length > 0));
        const activeName = isWarm
          ? (node.active_model_name || node.loaded_models[0])
          : (node.pinned_model ? `Standby (${node.pinned_model})` : 'Standby / Idle');
        
        let metaBadgesHtml = '';
        if (isWarm) {
          if (node.active_model_parameter_size) metaBadgesHtml += `<span class="model-meta-badge">${node.active_model_parameter_size}</span>`;
          if (node.active_model_quantization) metaBadgesHtml += `<span class="model-meta-badge">${node.active_model_quantization}</span>`;
          if (node.active_model_context_length) metaBadgesHtml += `<span class="model-meta-badge">Ctx: ${node.active_model_context_length}</span>`;
        }

        let offloadBarHtml = '';
        let swapAlertHtml = '<div class="swap-alert idle">○ Standby — Loads into memory dynamically</div>';

        if (isWarm && node.active_model_size_mb) {
          const gpuPct = node.active_model_gpu_pct ?? 100;
          const cpuPct = node.active_model_cpu_pct ?? 0;
          const vramGb = ((node.active_model_vram_mb || 0) / 1024).toFixed(1);
          const totalGb = (node.active_model_size_mb / 1024).toFixed(1);
          const cpuRamGb = Math.max(0, (node.active_model_size_mb - (node.active_model_vram_mb || 0)) / 1024).toFixed(1);

          offloadBarHtml = `
            <div class="offload-bar-wrapper">
              <div class="offload-labels">
                <span style="color: var(--green)">GPU VRAM: ${vramGb} GB (${gpuPct}%)</span>
                <span style="color: ${cpuPct > 0 ? 'var(--orange)' : 'var(--text-muted)'}">CPU RAM: ${cpuRamGb} GB (${cpuPct}%)</span>
              </div>
              <div class="offload-bar-track">
                <div class="bar-gpu" style="width: ${gpuPct}%"></div>
                <div class="bar-cpu" style="width: ${cpuPct}%"></div>
              </div>
            </div>
          `;

          if (node.is_swapping || cpuPct > 0) {
            swapAlertHtml = `<div class="swap-alert active">⚠️ Memory Swap Active (${cpuPct}% CPU Offload)</div>`;
          } else {
            swapAlertHtml = `<div class="swap-alert pure-gpu">✨ 100% Pure GPU (Zero Swap)</div>`;
          }
        } else if (isWarm) {
          swapAlertHtml = `<div class="swap-alert pure-gpu">● Model Loaded in VRAM</div>`;
        }

        // Performance / TPS widget
        let perfWidgetHtml = '';
        if (node.last_tokens_per_sec || node.last_completion_tokens) {
          const tps = node.last_tokens_per_sec ? `${node.last_tokens_per_sec} tok/s` : '-- tok/s';
          const promptInfo = node.last_prompt_tokens ? `Prompt: ${node.last_prompt_tokens} tok` : '';
          const compInfo = node.last_completion_tokens ? `Gen: ${node.last_completion_tokens} tok` : '';
          const durInfo = node.last_duration_sec ? `in ${node.last_duration_sec}s` : '';
          perfWidgetHtml = `
            <div class="perf-widget">
              <div>
                <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Latest Gen Speed</div>
                <div class="perf-rate">⚡ ${tps}</div>
              </div>
              <div class="perf-details">
                <div>${promptInfo} ${compInfo}</div>
                <div style="color: var(--cyan);">${durInfo}</div>
              </div>
            </div>
          `;
        }

        // Configured / Running Models
        let inventoryHtml = '';
        const configuredList = (node.configured_models && node.configured_models.length > 0)
          ? node.configured_models
          : (node.pinned_model ? [node.pinned_model] : []);

        if (configuredList.length > 0) {
          const badges = configuredList.map(m => {
            const isLoaded = (node.active_model_name && (node.active_model_name === m || node.active_model_name.includes(m) || m.includes(node.active_model_name))) ||
                             (node.loaded_models && node.loaded_models.some(lm => lm === m || lm.includes(m) || m.includes(lm)));
            const isInstalled = (node.available_models || []).some(am => am === m || am.includes(m) || m.includes(am));
            
            let badgeClass = 'inventory-badge';
            let label = m;
            if (isLoaded) {
              badgeClass += ' active-model';
              label = `● ${m} (In VRAM)`;
            } else if (isInstalled) {
              label = `○ ${m} (Ready)`;
            } else {
              label = `⚠️ ${m} (Not Found)`;
            }
            return `<span class="${badgeClass}">${label}</span>`;
          }).join('');

          inventoryHtml = `
            <div class="inventory-section">
              <div class="inventory-title">Configured Node Models</div>
              <div class="inventory-list">${badges}</div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="node-header">
            <div>
              <div class="node-title">${node.name} ${typeBadgeHtml}</div>
              <div class="node-url">${node.base_url}</div>
            </div>
            <span class="priority-badge">Priority ${node.priority}</span>
          </div>

          <div class="roles-list">${rolesHtml}</div>

          <div class="node-latency">
            <div class="latency-num" style="color: ${latencyColor}">${latencyText}</div>
            <div class="latency-p">${node.state !== 'OFFLINE' ? `P50: ${node.p50_latency_ms}ms / P95: ${node.p95_latency_ms}ms` : (node.error_message || 'Unreachable')}</div>
          </div>

          <div class="vram-section">
            <div class="vram-header">
              <span>Active Memory Residency</span>
              <span style="font-size: 0.75rem; color: ${isWarm ? 'var(--green)' : 'var(--text-muted)'}">${isWarm ? '● RESIDENT' : '○ IDLE'}</span>
            </div>
            <div class="model-name">${activeName}</div>
            ${metaBadgesHtml ? `<div class="model-tags">${metaBadgesHtml}</div>` : ''}
            ${offloadBarHtml}
            ${swapAlertHtml}
          </div>

          ${perfWidgetHtml}
          ${inventoryHtml}

          <div class="metrics-row">
            <span>In-flight: <strong>${node.active_requests}</strong></span>
            <span>Total Reqs: <strong>${node.total_requests}</strong></span>
            <span>Errors: <strong style="color: ${node.failed_requests > 0 ? 'var(--red)' : 'inherit'}">${node.failed_requests}</strong></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Auto-refresh every 3 seconds
    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
